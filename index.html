<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Добрый трекер</title>
<meta name="theme-color" content="#F2F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181B18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app, scrolling content between a calm header and a bottom tab bar; praise appears as a handwritten note */
:root {
  --bg: #F2F5EF;
  --surface: #FFFFFF;
  --surface-2: #E8EDE4;
  --fg: #262B25;
  --muted: #687264;
  --line: #D9E0D4;
  --accent: #B8527A;
  --accent-soft: #F6E3EB;
  --green: #2F8A52;
  --green-soft: #E1F1E6;
  --gold: #B88310;
  --gold-soft: #FBF0D4;
  --note: #FFF9E8;
  --shadow: 0 6px 24px rgba(38, 43, 37, .12);
  --font-body: "Nunito", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181B18; --surface: #222621; --surface-2: #2C312B; --fg: #ECEFE8; --muted: #9DA698;
    --line: #353B33; --accent: #E58BAE; --accent-soft: #3A2830; --green: #6CC48C; --green-soft: #1F3326;
    --gold: #E8BE55; --gold-soft: #3A3120; --note: #2E2A20; --shadow: 0 6px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181B18; --surface: #222621; --surface-2: #2C312B; --fg: #ECEFE8; --muted: #9DA698;
  --line: #353B33; --accent: #E58BAE; --accent-soft: #3A2830; --green: #6CC48C; --green-soft: #1F3326;
  --gold: #E8BE55; --gold-soft: #3A3120; --note: #2E2A20; --shadow: 0 6px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

header.top { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
header.top h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); }

h2 { margin: 0; font-size: 1.05rem; font-weight: 800; text-wrap: balance; }
.label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.view { display: flex; flex-direction: column; gap: 16px; }

/* Add form */
.add {
  background: var(--surface);
  border-radius: 18px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow);
}
.add input[type="text"] {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--bg);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 1rem;
}
.add input[type="text"]::placeholder { color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.seg button {
  border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hint { margin: 0; font-size: .9rem; color: var(--muted); }
.primary {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 800;
  background: var(--accent); color: #fff;
}
:root[data-theme="dark"] .primary { color: #1b1418; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #1b1418; } }

/* Task list */
.list { display: flex; flex-direction: column; gap: 10px; }
.task {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.task-head { display: flex; gap: 10px; align-items: flex-start; }
.task-title { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.chip {
  flex: none; font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 3px 9px;
  background: var(--surface-2); color: var(--muted);
}
.chip.long { background: var(--green-soft); color: var(--green); }
.chip.short { background: var(--gold-soft); color: var(--gold); }
.task-meta { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 11px;
  padding: 8px 12px; font-weight: 700; font-size: .92rem;
}
.btn.green { border-color: transparent; background: var(--green-soft); color: var(--green); }
.btn.gold { border-color: transparent; background: var(--gold-soft); color: var(--gold); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; margin-left: auto; }
.btn.danger { border-color: transparent; background: var(--accent-soft); color: var(--accent); }

.empty {
  border: 1.5px dashed var(--line); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted);
}

/* Task of the day */
.tod {
  background: var(--surface); border-radius: 22px; padding: 24px 20px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px;
}
.tod .big { font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
.tod p { margin: 0; }
.tod .soft { font-family: var(--font-hand); font-size: 1.45rem; line-height: 1.2; color: var(--accent); }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .n { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .t { font-size: .78rem; color: var(--muted); line-height: 1.25; }
.tile.short .n { color: var(--gold); }
.tile.green .n { color: var(--green); }
.tile.gold .n { color: var(--gold); }
.captions { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: .88rem; color: var(--muted); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
table.hearts { border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; min-width: 100%; }
table.hearts th, table.hearts td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.hearts th { font-weight: 700; color: var(--muted); font-size: .75rem; }
table.hearts th:first-child, table.hearts td:first-child {
  text-align: left; position: sticky; left: 0; background: var(--surface); padding-left: 12px;
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: var(--fg); font-size: .85rem;
}
table.hearts tr:last-child td { border-bottom: 0; }
.praise-line { margin: 0; font-family: var(--font-hand); font-size: 1.45rem; line-height: 1.2; color: var(--accent); }
.legend { margin: 0; font-size: .85rem; color: var(--muted); }

.data { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.data p { margin: 0; font-size: .88rem; color: var(--muted); }
.data textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); font: .78rem/1.4 ui-monospace, Menlo, monospace; padding: 10px; }
.file-label { display: inline-flex; }
.file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* Bottom nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {
  border: 0; background: transparent; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .78rem; font-weight: 700; color: var(--muted);
}
nav.tabs button .ico { font-size: 1.3rem; line-height: 1; filter: grayscale(.6); opacity: .8; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }
nav.tabs button[aria-selected="true"] .ico { filter: none; opacity: 1; }

/* Praise note */
.note {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  width: min(520px, calc(100% - 32px)); transform: translateX(-50%);
  background: var(--note); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px;
  box-shadow: var(--shadow); padding: 14px 16px 12px;
  font-family: var(--font-hand); font-size: 1.45rem; line-height: 1.2;
  animation: pop .28s ease-out;
}
.note small { display: block; font-family: var(--font-body); font-size: .75rem; color: var(--muted); margin-top: 6px; }
@keyframes pop { from { transform: translate(-50%, 12px) rotate(-1deg); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .note { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Добрый трекер</h1>
    <p id="greeting">🌼 Что хочешь сделать сегодня?</p>
  </header>

  <!-- ЗАДАЧИ -->
  <section class="view" id="view-tasks" aria-label="Задачи">
    <form class="add" id="add-form" autocomplete="off">
      <label class="label" for="new-title">📝 Новая задача</label>
      <input type="text" id="new-title" placeholder="Напиши название задачи" maxlength="200">
      <div class="seg" role="group" aria-label="Тип задачи">
        <button type="button" id="type-long" aria-pressed="true">📖 Длинная</button>
        <button type="button" id="type-short" aria-pressed="false">⚡ Короткая</button>
      </div>
      <p class="hint" id="type-hint"></p>
      <button type="submit" class="primary" id="add-btn">Добавить задачу</button>
    </form>

    <div class="view">
      <h2>📋 Твои активные задачи</h2>
      <div class="list" id="task-list"></div>
    </div>
  </section>

  <!-- ЗАДАЧА ДНЯ -->
  <section class="view" id="view-day" aria-label="Задача дня" hidden>
    <div id="tod-box"></div>
  </section>

  <!-- СТАТИСТИКА -->
  <section class="view" id="view-stats" aria-label="Статистика" hidden>
    <div class="seg" role="group" aria-label="Период">
      <button type="button" id="period-7" aria-pressed="true">7 дней</button>
      <button type="button" id="period-30" aria-pressed="false">30 дней</button>
    </div>
    <div id="stats-box" class="view"></div>

    <div class="data">
      <span class="label">Мои данные</span>
      <p>Задачи хранятся только в этом телефоне. Иногда сохраняй копию: формат тот же, что у консольной версии (tracker_data.json).</p>
      <div class="actions">
        <button type="button" class="btn" id="export-btn">Сохранить копию</button>
        <button type="button" class="btn" id="copy-btn">Скопировать текстом</button>
        <label class="btn file-label" for="import-file">Загрузить из файла
          <input type="file" id="import-file" accept=".json,application/json">
        </label>
      </div>
      <textarea id="export-text" readonly hidden aria-label="Данные в формате JSON"></textarea>
      <div id="import-confirm" hidden class="actions">
        <p id="import-msg" style="flex-basis:100%"></p>
        <button type="button" class="btn danger" id="import-yes">Заменить</button>
        <button type="button" class="btn" id="import-no">Отмена</button>
      </div>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="in" role="tablist">
    <button type="button" role="tab" id="tab-tasks" aria-selected="true"><span class="ico">🌱</span>Задачи</button>
    <button type="button" role="tab" id="tab-day" aria-selected="false"><span class="ico">🎲</span>Задача дня</button>
    <button type="button" role="tab" id="tab-stats" aria-selected="false"><span class="ico">📊</span>Статистика</button>
  </div>
</nav>

<div class="note" id="note" role="status" hidden></div>

<script>
// ==================== ДОБРЫЕ СООБЩЕНИЯ (из консольной версии) ====================
const MESSAGES = {
  welcome: "🌸 Привет! Это твой добрый трекер задач.",
  greeting: "🌼 Что хочешь сделать сегодня?",
  long_task_hint: "✨ Это длинная задача. Можно отмечать прогресс зелёными сердечками, даже если ты просто немного поработала над ней. Каждый шаг важен! 🌱",
  short_task_hint: "⚡ Это короткая задача. Сделаешь — получишь золотое сердечко!",
  task_added: "✅ Задача «{title}» добавлена! Ты молодец, что начала её отслеживать.",
  empty_title: "🌱 Название не может быть пустым. Напиши хоть пару слов.",
  no_tasks: "🌱 В списке пока нет задач. Добавь что-нибудь, даже маленькое!",
  green_heart: "💚 Зелёное сердечко для «{title}»! Ты приближаешься к цели. Я тобой горжусь.",
  gold_heart: "💛 Золотое сердечко! Ты завершила «{title}». Это победа! 🎉",
  task_completed_short: "💛 Золотое сердечко для «{title}»! Короткая задача выполнена. Ты супер! ✨",
  no_tasks_for_tod: "🌸 В списке нет активных задач. Добавь что-нибудь, и я выберу задачу дня!",
  tod_long: "Ты можешь отметить прогресс зелёным сердечком, даже если просто немного поработаешь над ней. 🌱",
  tod_short: "Сделаешь — получишь золотое сердечко! ✨",
  tod_soft: "Главное — не дави на себя. Завтра будет новый день 🌷",
  short_count: "ты быстро справляешься с мелкими делами — это отлично!",
  green_count: "ты двигаешь длинные задачи вперёд",
  gold_long_count: "большие цели достигнуты — это серьёзное достижение!",
  praise: "🌸 Ты молодец! Даже просто заглянуть в трекер и посмотреть статистику — уже забота о себе. 🌸",
  no_stats: "🌸 Пока нет статистики. Добавляй задачи и отмечай прогресс — и здесь появятся твои достижения!",
  no_long_tasks: "📭 Нет данных о длинных задачах за этот период",
  legend: "💚 — зелёное сердечко (обычный прогресс) · 💛 — золотое сердечко (завершение длинной задачи)",
  removed: "🌱 Убрала задачу «{title}». Отпускать лишнее — тоже забота о себе.",
  saved_copy: "💾 Копия сохранена. Ты бережёшь свои достижения — это мудро.",
  imported: "📥 Данные загружены. С возвращением! 🌸",
  bad_file: "🌱 Этот файл не похож на данные трекера. Попробуй другой?",
};
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

// ==================== РАБОТА С ДАННЫМИ ====================
const KEY = "dobry_tracker_data";
const TOD_KEY = "dobry_tracker_tod";
const empty = () => ({ tasks: [], history: [], next_id: 1 });

function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
}
function loadData() {
  try {
    const raw = store(KEY);
    if (!raw) return empty();
    const d = JSON.parse(raw);
    return valid(d) ? d : empty();
  } catch (e) { return empty(); }
}
function valid(d) {
  return d && Array.isArray(d.tasks) && Array.isArray(d.history) && typeof d.next_id === "number";
}
function saveData() { store(KEY, JSON.stringify(data)); }

let data = loadData();
let newType = "long";
let period = 7;
let openDelete = null;

// Дата в местном времени, как datetime.now() в Python
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function cutoff(days) {
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const active = () => data.tasks.filter(t => t.status === "active");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ==================== ПОХВАЛА ====================
let noteTimer;
function praise(text, sub) {
  const n = document.getElementById("note");
  n.innerHTML = esc(text) + (sub ? "<small>" + esc(sub) + "</small>" : "");
  n.hidden = false;
  n.style.animation = "none"; void n.offsetWidth; n.style.animation = "";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { n.hidden = true; }, 4500);
}
document.getElementById("note").addEventListener("click", e => { e.currentTarget.hidden = true; });

// ==================== ДЕЙСТВИЯ ====================
function addTask(title, type) {
  const task = { id: data.next_id, title, type, status: "active" };
  data.tasks.push(task);
  data.next_id += 1;
  saveData();
  praise(fmt(MESSAGES.task_added, { title }));
}
function logHeart(task, action) {
  data.history.push({ date: today(), task_id: task.id, task_title: task.title, task_type: task.type, action });
}
function markGreen(id) {
  const task = data.tasks.find(t => t.id === id); if (!task) return;
  logHeart(task, "green_heart");
  saveData();
  praise(fmt(MESSAGES.green_heart, { title: task.title }));
  renderAll();
}
function markGold(id) {
  const task = data.tasks.find(t => t.id === id); if (!task) return;
  logHeart(task, "gold_heart");
  data.tasks = data.tasks.filter(t => t.id !== id);
  saveData();
  praise(fmt(task.type === "long" ? MESSAGES.gold_heart : MESSAGES.task_completed_short, { title: task.title }));
  renderAll();
}
function removeTask(id) {
  const task = data.tasks.find(t => t.id === id); if (!task) return;
  data.tasks = data.tasks.filter(t => t.id !== id);
  saveData();
  openDelete = null;
  praise(fmt(MESSAGES.removed, { title: task.title }));
  renderAll();
}

function getStats(days) {
  const c = cutoff(days);
  const h = data.history.filter(x => x.date >= c);
  return {
    short: h.filter(x => x.task_type === "short" && x.action === "gold_heart").length,
    green: h.filter(x => x.task_type === "long" && x.action === "green_heart").length,
    gold_long: h.filter(x => x.task_type === "long" && x.action === "gold_heart").length,
  };
}
function greensFor(id) { return data.history.filter(h => h.task_id === id && h.action === "green_heart").length; }

// ==================== ОТРИСОВКА ====================
function heartWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "сердечко";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "сердечка";
  return "сердечек";
}

function taskActions(t) {
  if (openDelete === t.id) {
    return `<div class="actions">
      <span class="task-meta" style="flex-basis:100%">Убрать задачу без сердечка?</span>
      <button type="button" class="btn danger" data-act="remove" data-id="${t.id}">Убрать</button>
      <button type="button" class="btn" data-act="keep" data-id="${t.id}">Оставить</button>
    </div>`;
  }
  const main = t.type === "long"
    ? `<button type="button" class="btn green" data-act="green" data-id="${t.id}">💚 Поработала</button>
       <button type="button" class="btn gold" data-act="gold" data-id="${t.id}">💛 Закончила</button>`
    : `<button type="button" class="btn gold" data-act="gold" data-id="${t.id}">💛 Сделала</button>`;
  return `<div class="actions">${main}<button type="button" class="btn quiet" data-act="ask" data-id="${t.id}" aria-label="Убрать задачу">✕</button></div>`;
}

function renderTasks() {
  const list = document.getElementById("task-list");
  const tasks = active();
  if (!tasks.length) { list.innerHTML = `<div class="empty">${esc(MESSAGES.no_tasks)}</div>`; return; }
  list.innerHTML = tasks.map(t => {
    const g = t.type === "long" ? greensFor(t.id) : 0;
    const meta = t.type === "long"
      ? (g ? `💚 × ${g} — уже ${g} ${heartWord(g)} прогресса` : "Пока без сердечек, и это нормально")
      : "";
    return `<article class="task">
      <div class="task-head">
        <div class="task-title">${esc(t.title)}</div>
        <span class="chip ${t.type}">${t.type === "long" ? "📖 длинная" : "⚡ короткая"}</span>
      </div>
      ${meta ? `<div class="task-meta">${meta}</div>` : ""}
      ${taskActions(t)}
    </article>`;
  }).join("");
}

function pickTod(force) {
  const tasks = active();
  if (!tasks.length) return null;
  let saved = null;
  try { saved = JSON.parse(store(TOD_KEY) || "null"); } catch (e) {}
  if (!force && saved && saved.date === today()) {
    const t = tasks.find(x => x.id === saved.id);
    if (t) return t;
  }
  let pool = tasks;
  if (force && saved && tasks.length > 1) pool = tasks.filter(x => x.id !== saved.id);
  const t = pool[Math.floor(Math.random() * pool.length)];
  store(TOD_KEY, JSON.stringify({ date: today(), id: t.id }));
  return t;
}

function renderDay(force) {
  const box = document.getElementById("tod-box");
  const t = pickTod(force);
  if (!t) { box.innerHTML = `<div class="empty">${esc(MESSAGES.no_tasks_for_tod)}</div>`; return; }
  const long = t.type === "long";
  box.innerHTML = `<div class="tod">
    <span class="label">🎲 Твоя задача дня</span>
    <div class="big">«${esc(t.title)}»</div>
    <p>Это ${long ? "длинная" : "короткая"} задача. ${esc(long ? MESSAGES.tod_long : MESSAGES.tod_short)}</p>
    <p class="soft">${esc(MESSAGES.tod_soft)}</p>
    <div class="actions">
      ${long ? `<button type="button" class="btn green" data-act="green" data-id="${t.id}">💚 Поработала</button>` : ""}
      <button type="button" class="btn gold" data-act="gold" data-id="${t.id}">💛 ${long ? "Закончила" : "Сделала"}</button>
      ${active().length > 1 ? `<button type="button" class="btn quiet" data-act="reroll">Другую 🎲</button>` : ""}
    </div>
  </div>`;
}

function renderStats() {
  const box = document.getElementById("stats-box");
  if (!data.history.length) { box.innerHTML = `<div class="empty">${esc(MESSAGES.no_stats)}</div>`; return; }
  const s = getStats(period);
  let html = `<div class="tiles">
      <div class="tile short"><span class="n">${s.short}</span><span class="t">✨ коротких задач завершено</span></div>
      <div class="tile green"><span class="n">${s.green}</span><span class="t">💚 зелёных сердечек</span></div>
      <div class="tile gold"><span class="n">${s.gold_long}</span><span class="t">💛 длинных задач завершено</span></div>
    </div>
    <ul class="captions">
      ${s.short ? `<li>✨ ${esc(MESSAGES.short_count)}</li>` : ""}
      ${s.green ? `<li>💚 ${esc(MESSAGES.green_count)}</li>` : ""}
      ${s.gold_long ? `<li>💛 ${esc(MESSAGES.gold_long_count)}</li>` : ""}
    </ul>
    <h2>📊 Длинные задачи по дням</h2>`;
  html += heartsTable(period);
  html += `<p class="praise-line">${esc(MESSAGES.praise)}</p>`;
  box.innerHTML = html;
}

function heartsTable(days) {
  const c = cutoff(days);
  const rows = new Map(); // название → {дата: тип}
  const dates = new Set();
  for (const e of data.history) {
    if (e.date < c || (e.task_type || "short") !== "long") continue;
    const name = e.task_title;
    if (!rows.has(name)) rows.set(name, {});
    const cell = rows.get(name);
    // золотое важнее зелёного, если в один день было оба
    if (cell[e.date] !== "gold") cell[e.date] = e.action === "gold_heart" ? "gold" : "green";
    dates.add(e.date);
  }
  if (!rows.size) return `<div class="empty">${esc(MESSAGES.no_long_tasks)}</div>`;
  const sorted = [...dates].sort();
  const label = d => d.slice(8, 10) + "." + d.slice(5, 7);
  let t = `<div class="table-wrap"><table class="hearts"><thead><tr><th scope="col">Задача</th>`;
  t += sorted.map(d => `<th scope="col">${label(d)}</th>`).join("") + `</tr></thead><tbody>`;
  for (const [name, cells] of rows) {
    t += `<tr><td title="${esc(name)}">${esc(name)}</td>`;
    t += sorted.map(d => `<td>${cells[d] === "gold" ? "💛" : cells[d] === "green" ? "💚" : ""}</td>`).join("");
    t += `</tr>`;
  }
  t += `</tbody></table></div><p class="legend">${esc(MESSAGES.legend)}</p>`;
  return t;
}

function renderHint() {
  document.getElementById("type-hint").textContent = newType === "long" ? MESSAGES.long_task_hint : MESSAGES.short_task_hint;
  document.getElementById("type-long").setAttribute("aria-pressed", newType === "long");
  document.getElementById("type-short").setAttribute("aria-pressed", newType === "short");
}

let currentTab = "tasks";
function renderAll() {
  renderTasks();
  if (currentTab === "day") renderDay(false);
  if (currentTab === "stats") renderStats();
}

function showTab(name) {
  currentTab = name;
  for (const n of ["tasks", "day", "stats"]) {
    document.getElementById("view-" + n).hidden = n !== name;
    document.getElementById("tab-" + n).setAttribute("aria-selected", n === name);
  }
  renderAll();
  window.scrollTo(0, 0);
}

// ==================== СОБЫТИЯ ====================
document.getElementById("tab-tasks").onclick = () => showTab("tasks");
document.getElementById("tab-day").onclick = () => showTab("day");
document.getElementById("tab-stats").onclick = () => showTab("stats");
document.getElementById("type-long").onclick = () => { newType = "long"; renderHint(); };
document.getElementById("type-short").onclick = () => { newType = "short"; renderHint(); };
document.getElementById("period-7").onclick = () => { period = 7; setPeriod(); };
document.getElementById("period-30").onclick = () => { period = 30; setPeriod(); };
function setPeriod() {
  document.getElementById("period-7").setAttribute("aria-pressed", period === 7);
  document.getElementById("period-30").setAttribute("aria-pressed", period === 30);
  renderStats();
}

document.getElementById("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("new-title");
  const title = input.value.trim();
  if (!title) { praise(MESSAGES.empty_title); input.focus(); return; }
  addTask(title, newType);
  input.value = "";
  renderTasks();
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = Number(b.dataset.id);
  switch (b.dataset.act) {
    case "green": markGreen(id); break;
    case "gold": markGold(id); break;
    case "ask": openDelete = id; renderTasks(); break;
    case "keep": openDelete = null; renderTasks(); break;
    case "remove": removeTask(id); break;
    case "reroll": renderDay(true); break;
  }
});

// Экспорт / импорт в формате tracker_data.json
const exportJson = () => JSON.stringify(data, null, 2);
document.getElementById("export-btn").onclick = () => {
  try {
    const blob = new Blob([exportJson()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tracker_data.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    praise(MESSAGES.saved_copy);
  } catch (err) { showExportText(); }
};
function showExportText() {
  const ta = document.getElementById("export-text");
  ta.value = exportJson(); ta.hidden = false; ta.focus(); ta.select();
}
document.getElementById("copy-btn").onclick = async () => {
  try { await navigator.clipboard.writeText(exportJson()); praise("📋 Скопировала. Вставь в заметку или файл, и копия будет в надёжном месте."); }
  catch (err) { showExportText(); }
};

let pending = null;
document.getElementById("import-file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!valid(d)) throw new Error("bad");
      pending = d;
      document.getElementById("import-msg").textContent =
        `В файле ${d.tasks.filter(t => t.status === "active").length} активных задач и ${d.history.length} записей с сердечками. Заменить текущие данные на эти?`;
      document.getElementById("import-confirm").hidden = false;
    } catch (err) { praise(MESSAGES.bad_file); }
  };
  r.readAsText(f, "utf-8");
});
document.getElementById("import-yes").onclick = () => {
  if (!pending) return;
  data = pending; pending = null;
  saveData();
  document.getElementById("import-confirm").hidden = true;
  praise(MESSAGES.imported);
  renderAll();
};
document.getElementById("import-no").onclick = () => { pending = null; document.getElementById("import-confirm").hidden = true; };

// ==================== СТАРТ ====================
document.getElementById("greeting").textContent = MESSAGES.greeting;
renderHint();
renderAll();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
