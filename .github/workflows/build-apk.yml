name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Установить Flet и инструмент сборки
        run: pip install "flet==1.0.3" "flet-cli==1.0.3"

      - name: Собрать APK
        env:
          PYTHONUTF8: "1"
        run: flet build apk --yes --no-rich-output --python-version 3.13

      - uses: actions/upload-artifact@v7
        with:
          name: kind-tracker-apk
          path: build/apk
          if-no-files-found: error
